name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test in Chrome
        run: |
          npm run preview &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4190/ > /dev/null && break; sleep 1; done
          npm run smoke
