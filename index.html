<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coffee with VCs: where investors meet founders in Bengaluru and Mumbai</title>
    <meta name="description" content="The cafés in Bengaluru and Mumbai where VCs and angels have met founders. Every pin links to the post it came from." />
    <meta name="theme-color" content="#FBFAF7" />
    <meta property="og:title" content="Coffee with VCs" />
    <meta property="og:description" content="The Bengaluru and Mumbai cafés where investors meet founders. Every pin links to the post it came from." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full overflow-hidden bg-paper font-sans text-[15px] leading-normal text-ink antialiased">
    <div class="h-dvh lg:grid lg:grid-cols-[clamp(400px,34vw,480px)_1fr]">
      <aside
        class="fixed inset-x-0 bottom-0 top-[40dvh] z-10 flex flex-col rounded-t-[20px] bg-paper shadow-[0_-10px_30px_-16px_rgb(23_21_17/0.35)] lg:static lg:min-h-0 lg:rounded-none lg:border-r lg:border-line lg:shadow-none"
        aria-label="Cafés"
      >
        <header class="flex items-center justify-between gap-3 border-b border-line px-4 py-3 lg:px-6 lg:py-3.5">
          <a class="whitespace-nowrap font-serif text-[21px] leading-none tracking-[-0.01em] no-underline lg:text-[23px]" href="#/" id="home">Coffee with VCs</a>
          <nav class="flex rounded-full bg-sunk p-[3px]" aria-label="City">
            <a class="seg-opt" data-city="bengaluru" href="#/bengaluru">Bengaluru</a>
            <a class="seg-opt" data-city="mumbai" href="#/mumbai">Mumbai</a>
          </nav>
        </header>
        <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain [scrollbar-color:var(--color-line-2)_transparent] [scrollbar-width:thin]" id="panel-body"></div>
      </aside>
      <main class="fixed inset-x-0 top-0 h-[calc(40dvh+20px)] lg:relative lg:h-auto lg:min-w-0">
        <div id="map" class="h-full w-full" aria-label="Map of the cafés"></div>
        <div class="absolute left-1/2 top-4 z-10 -translate-x-1/2 rounded-full bg-ink px-3.5 py-2 text-[13px] text-white" id="banner" role="alert" hidden>
          The map isn't loading. Check your connection.
        </div>
      </main>
    </div>
    <dialog
      class="m-auto max-h-[min(80vh,720px)] w-[min(480px,calc(100vw-32px))] rounded-[20px] border-0 bg-paper p-0 text-ink shadow-sheet backdrop:bg-ink/30 open:flex open:animate-rise open:flex-col"
      id="follow"
      aria-labelledby="follow-title"
    ></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
